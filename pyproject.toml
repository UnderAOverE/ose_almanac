# =====================================================================================================
# ose_almanac - OpenShift ConfigMap Intelligence Platform
# Build, dependency, and tool configuration.
# =====================================================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ose-almanac"
version = "1.0.0"
description = "OpenShift ConfigMap Intelligence Platform - estate-wide ConfigMap collection and configuration-assurance analytics"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Shane Reddy", email = "shanevreddy@gmail.com" }]
dependencies = [
    "motor>=3.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "PyYAML>=6.0",
    "polars>=1.0",
    "numpy>=2.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

# Imports are src.-prefixed (from src.common..., from src.batch...), so the
# wheel ships the src directory itself as the top-level package.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E402: imports below sys.dont_write_bytecode - required by the file template.
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
